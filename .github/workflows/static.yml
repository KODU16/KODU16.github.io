name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      changed: ${{ steps.source.outputs.changed }}
    steps:
      - name: Check Clever release source
        id: source
        shell: bash
        run: |
          SHA=$(git ls-remote https://github.com/KODU16/tswn-core-clever.git refs/heads/main | cut -f1)
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          LIVE=$(curl -fsSL --retry 3 "https://kodu16.github.io/namerena-clever/build.json?run=${{ github.run_id }}" || echo '{}')
          LIVE_SHA=$(printf '%s' "$LIVE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))')
          if [ "$SHA" = "$LIVE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: source
    if: github.event_name != 'schedule' || needs.source.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homepage
        uses: actions/checkout@v4
        with:
          path: homepage
      - name: Checkout Clever engine and frontend
        uses: actions/checkout@v4
        with:
          repository: KODU16/tswn-core-clever
          ref: ${{ needs.source.outputs.sha }}
          path: engine
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Test battle frontend
        working-directory: engine
        run: node --test crates/tswn_wasm/tests/*.test.mjs
      - name: Build Clever WASM
        working-directory: engine
        run: |
          cargo build --locked --release -p tswn_wasm --target wasm32-unknown-unknown
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/tswn_wasm/Cargo.toml", "rb"))["dependencies"]["wasm-bindgen"])')
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/tswn_wasm.wasm
      - name: Assemble homepage and Clever frontend
        run: |
          mkdir -p site/namerena-clever/pkg
          cp homepage/index.html site/index.html
          cp -R homepage/hitokoto site/hitokoto
          cp engine/crates/tswn_wasm/examples/*.html site/namerena-clever/
          cp engine/crates/tswn_wasm/examples/*.css site/namerena-clever/
          cp engine/crates/tswn_wasm/examples/*.js site/namerena-clever/
          cp engine/pkg/* site/namerena-clever/pkg/
          touch site/.nojekyll
          ENGINE_SHA=$(git -C engine rev-parse HEAD)
          printf '{"repository":"KODU16/tswn-core-clever","commit":"%s"}\n' "$ENGINE_SHA" > site/namerena-clever/build.json
          test -s site/namerena-clever/pkg/tswn_wasm_bg.wasm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
